<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>UniFLOW DevTool — 시나리오 편집기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
      font-size: 13px; color: #1a1a1a; background: #f3f4f6;
      height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #1a1a2e; color: #fff; padding: 12px 18px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 15px; font-weight: 600; margin-right: 6px; }
    header .spacer { flex: 1; }
    header input[type="text"], header input[type="number"] {
      padding: 5px 8px; border: 1px solid #3b3b5c; border-radius: 6px;
      background: #2a2a45; color: #fff; font-size: 12px;
    }
    header label { font-size: 12px; color: #cbd5e1; display: flex; align-items: center; gap: 4px; }
    button {
      padding: 6px 12px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost { background: #2a2a45; color: #e5e7eb; }
    .btn-ghost:hover { background: #3b3b5c; }
    .btn-copy.copied { background: #059669 !important; color: #fff; }

    main { flex: 1; display: flex; overflow: hidden; }
    .pane { overflow-y: auto; padding: 16px; }
    .steps-pane { flex: 1; min-width: 380px; }
    .code-pane {
      width: 46%; min-width: 360px; background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column; padding: 0;
    }
    .code-toolbar {
      padding: 10px 14px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #1e293b; background: #111827;
    }
    .code-toolbar .title { font-size: 12px; font-weight: 700; color: #93c5fd; flex: 1; }
    pre {
      flex: 1; overflow: auto; padding: 14px 16px; margin: 0;
      font-family: 'Consolas', 'Menlo', monospace; font-size: 12px; line-height: 1.55;
      white-space: pre; tab-size: 2;
    }

    .pane-title { font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .empty { text-align: center; color: #9ca3af; padding: 60px 20px; line-height: 1.7; }

    /* 타임라인 커넥터 (단계 연결 flow) */
    .gap {
      position: relative; padding: 5px 0 5px 48px; min-height: 32px;
      display: flex; align-items: center; color: #787774; font-size: 12px;
    }
    .gap::before {
      content: ''; position: absolute; left: 20px; top: 0; bottom: 0;
      width: 2px; background: #d8d8d6;
    }
    .gap .gap-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #fff; border: 1px solid #e9e9e7; border-radius: 20px; padding: 3px 11px;
    }
    .gap .gap-chip input {
      width: 58px; padding: 1px 4px; border: none; border-bottom: 1px solid #d8d8d6;
      font-size: 12px; text-align: right; background: transparent; color: #37352f;
    }
    .gap .gap-chip input:focus { outline: none; border-bottom-color: #2383e2; }

    /* 스텝 카드 */
    .card {
      position: relative;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 12px 14px 12px 48px; display: flex; gap: 10px; align-items: flex-start;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card::before {
      content: ''; position: absolute; left: 20px; top: 0; bottom: 0;
      width: 2px; background: #d8d8d6;
    }
    .card:first-child::before { top: 22px; }
    .card:last-child::before { bottom: calc(100% - 36px); }
    .card.dragging { opacity: .4; }
    .card.disabled { opacity: .5; background: #fafafa; }
    .card .num {
      position: absolute; left: 8px; top: 11px; z-index: 1;
      width: 26px; height: 26px; border-radius: 50%;
      background: #eaf3fb; color: #2383e2; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 3px #fff;
    }
    .card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .card .row1 { display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex: 0 0 auto; }
    .tag.start { background: #d1fae5; color: #065f46; }
    .tag.navigate { background: #e0e7ff; color: #3730a3; }
    .tag.click { background: #fef3c7; color: #92400e; }
    .tag.input { background: #fce7f3; color: #9d174d; }
    .tag.assert { background: #dcfce7; color: #166534; }
    .card .target { flex: 1; font-family: 'Consolas', monospace; font-size: 11px; color: #374151; }
    .card .fields { display: flex; flex-direction: column; gap: 5px; }
    .field { display: flex; align-items: center; gap: 6px; }
    .field label { font-size: 10px; color: #9ca3af; flex: 0 0 52px; }
    .field input {
      flex: 1; padding: 4px 7px; border: 1px solid #e5e7eb; border-radius: 5px;
      font-size: 11px; font-family: 'Consolas', monospace; color: #374151; min-width: 0;
    }
    .field input:focus { outline: none; border-color: #2563eb; }
    .field select { flex: 1; padding: 4px 7px; border: 1px solid #e5e7eb; border-radius: 5px; font-size: 11px; color: #374151; background: #fff; }
    .card .actions { display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .icon-btn {
      width: 24px; height: 24px; border-radius: 5px; border: 1px solid #e5e7eb;
      background: #fff; cursor: pointer; font-size: 12px; line-height: 1; color: #6b7280; padding: 0;
    }
    .icon-btn:hover { background: #f3f4f6; }
    .icon-btn.del:hover { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
    .drag-handle { cursor: grab; color: #9ca3af; user-select: none; font-size: 14px; }
    .hint { font-size: 11px; color: #9ca3af; margin: 4px 0 12px 2px; }
    .scenario-desc {
      width: 100%; margin-bottom: 12px; padding: 9px 11px;
      border: 1px solid #e5e7eb; border-radius: 8px;
      font-family: inherit; font-size: 13px; color: #374151; line-height: 1.5;
      resize: vertical; box-sizing: border-box;
    }
    .scenario-desc:focus { outline: none; border-color: #2563eb; }
    .add-assert {
      margin-top: 12px; width: 100%; padding: 9px;
      border: 1px dashed #cbd5e1; background: #fff; color: #475569;
      border-radius: 8px; font-weight: 600;
    }
    .add-assert:hover { background: #f8fafc; border-color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>시나리오 편집기</h1>
    <input type="text" id="scenarioName" placeholder="테스트 이름" style="width:180px;">
    <label><input type="checkbox" id="applyGaps" checked> gap 적용</label>
    <label>≥ <input type="number" id="gapThreshold" value="300" min="0" step="100" style="width:64px;"> ms</label>
    <span class="spacer"></span>
    <button class="btn-ghost" id="reloadBtn" title="현재 녹화 데이터로 초기화">녹화에서 불러오기</button>
    <button class="btn-ghost" id="saveBtn">저장</button>
    <button class="btn-primary btn-copy" id="copyBtn">코드 복사</button>
    <button class="btn-primary" id="downloadBtn">.spec.ts 다운로드</button>
  </header>

  <main>
    <section class="pane steps-pane">
      <div class="pane-title">이벤트 시나리오</div>
      <textarea id="scenarioDesc" class="scenario-desc" rows="2"
        placeholder="시나리오 설명 (선택) — 내보낸 코드 상단에 주석으로 포함됩니다"></textarea>
      <div class="hint">카드를 드래그해 순서 변경 · 값/갭 인라인 수정 · ✕ 삭제 · 체크 해제로 비활성</div>
      <div id="stepList"></div>
      <button id="addAssertBtn" class="add-assert">+ 검증(성공/실패 판정) 스텝 추가</button>
    </section>
    <section class="pane code-pane">
      <div class="code-toolbar">
        <span class="title">Playwright 미리보기</span>
        <span id="stepCount" style="font-size:11px;color:#64748b;"></span>
      </div>
      <pre><code id="code"></code></pre>
    </section>
  </main>

  <script src="editor.js"></script>
</body>
</html>
