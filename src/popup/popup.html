<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --text: #37352f;
      --text-2: #6b6a66;
      --text-3: #9b9a97;
      --bg: #ffffff;
      --bg-2: #f7f7f5;
      --border: #e9e9e7;
      --border-2: #e0e0dd;
      --accent: #2383e2;
      --accent-weak: #eaf3fb;
      --radius: 8px;
      --hover: #efefee;
    }
    body {
      width: 620px;
      max-height: 580px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .header .badge {
      font-size: 12px; font-weight: 600; color: var(--text-3);
      background: var(--bg-2); padding: 3px 9px; border-radius: 20px;
    }

    /* 탭 */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-3);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .tab:hover { color: var(--text); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .actions {
      padding: 14px 20px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    button {
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .btn-extract { background: var(--accent); color: #fff; flex: 1; }
    .btn-extract:hover { background: #1a72c8; }
    .btn-record { background: #eb5757; color: #fff; flex: 1; }
    .btn-record:hover { background: #d94b4b; }
    .btn-record.recording { background: #f2994a; color: #fff; }
    .btn-clear { background: var(--bg); color: #eb5757; border-color: var(--border-2); }
    .btn-clear:hover { background: #fdf0f0; }
    .btn-copy { background: var(--bg-2); color: var(--text); border-color: var(--border); }
    .btn-copy:hover { background: var(--hover); }
    .btn-copy.copied { background: #e8f3ec; color: #2f7d4f; border-color: #cfe7d6; }

    .page-info {
      padding: 12px 20px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-2);
      word-break: break-all;
    }
    .page-info strong { color: var(--text); }
    .result-area {
      max-height: 400px;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .section { margin-bottom: 18px; }
    .section-title {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-3); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-title .count {
      background: var(--bg-2); color: var(--text-2);
      font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 20px;
    }
    .file-list { list-style: none; }
    .file-list li {
      padding: 8px 11px; margin-bottom: 5px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 13px; word-break: break-all; color: var(--text);
    }
    .file-list li.main-file { border-color: var(--accent); background: var(--accent-weak); }
    .tag {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 5px; margin-right: 5px;
    }
    .tag-script { background: #fbeec3; color: #80590f; }
    .tag-require { background: #dbeafe; color: #1e40af; }
    .tag-style { background: #d1fae5; color: #065f46; }
    .tag-main { background: var(--accent); color: #fff; }
    .tag-click { background: #fbeec3; color: #80590f; }
    .tag-input { background: #fce7f3; color: #9d174d; }
    .tag-nav { background: #e0e7ff; color: #3730a3; }
    .tag-start { background: #d1fae5; color: #065f46; }
    .tag-screenshot { background: var(--bg-2); color: var(--text-2); }
    .tag-assert { background: #dcfce7; color: #166534; }
    .screenshot-step { display: flex; flex-direction: column; gap: 4px; }
    .screenshot-thumb {
      max-width: 100%; max-height: 88px;
      border-radius: var(--radius); border: 1px solid var(--border);
      object-fit: cover;
    }

    .step-text { color: var(--text-2); margin-left: 4px; }
    .empty {
      text-align: center; padding: 48px 20px;
      color: var(--text-3); font-size: 14px; line-height: 1.7;
    }
    .filter-row {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: none; align-items: center; gap: 8px;
    }
    .filter-row.show { display: flex; }
    .filter-row label { font-size: 13px; color: var(--text-2); }
    .recording-status {
      padding: 13px 20px;
      background: #fdf0f0;
      border-bottom: 1px solid #f6d6d6;
      font-size: 13px; color: #c0392b;
      display: flex; align-items: center; gap: 8px;
    }
    .recording-status .dot {
      width: 8px; height: 8px; background: #eb5757;
      border-radius: 50%; animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .btn-sheet-save { background: var(--bg-2); color: var(--text); border-color: var(--border); font-size: 13px; padding: 8px 12px; }
    .btn-sheet-save:hover { background: var(--hover); }
  </style>
</head>
<body>
  <div class="header">
    <h1>UniFLOW DevTool</h1>
    <span class="badge">v0.3</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="extract">파일 추출</div>
    <div class="tab" data-tab="record">접근경로 녹화</div>
    <div class="tab" data-tab="settings">설정</div>
  </div>

  <!-- 파일 추출 탭 -->
  <div class="tab-content active" id="tab-extract">
    <div class="actions">
      <button class="btn-extract" id="extractBtn">현재 화면 추출</button>
      <button class="btn-copy" id="copyExtractBtn" style="display:none;">복사</button>
    </div>
    <div class="filter-row" id="filterRow">
      <input type="checkbox" id="filterCommon" checked>
      <label for="filterCommon">공통/라이브러리 제외</label>
    </div>
    <div id="pageInfo" class="page-info" style="display:none;"></div>
    <div id="extractResult" class="result-area">
      <div class="empty">
        버튼을 눌러 현재 화면의<br>JS / CSS 파일 목록을 추출합니다.
      </div>
    </div>
  </div>

  <!-- 접근경로 녹화 탭 -->
  <div class="tab-content" id="tab-record">
    <div id="recordingStatus" style="display:none;" class="recording-status">
      <div class="dot"></div>
      <span>녹화 진행 중 — 화면을 이동하며 클릭하세요. 완료 후 녹화 바의 [중지] 버튼을 누르세요.</span>
    </div>
    <div class="actions">
      <button class="btn-record" id="recordBtn">녹화 시작</button>
      <button class="btn-copy" id="copyRecordBtn" style="display:none;">복사</button>
      <button class="btn-copy" id="openEditorBtn" style="display:none;">▶ Playwright</button>
      <button class="btn-clear" id="clearBtn" style="display:none;">초기화</button>
    </div>
    <div id="recordResult" class="result-area">
      <div class="empty">
        녹화를 시작하면 클릭 경로가 기록됩니다.<br>
        페이지를 이동해도 녹화가 유지됩니다.
      </div>
    </div>
  </div>

  <!-- 설정 탭 -->
  <div class="tab-content" id="tab-settings">
    <div class="result-area">
      <div class="section">
        <div class="section-title">도메인별 API 토큰 (F3 사용자 전환)</div>
        <div style="font-size:13px;color:#6b7280;margin-bottom:8px;line-height:1.6;">
          페이지에서 <code style="background:#f3f4f6;padding:1px 4px;border-radius:3px;">F3</code> 사용자 전환 모달이
          호출하는 <code style="background:#f3f4f6;padding:1px 4px;border-radius:3px;">clientKey</code> 토큰을
          <strong>도메인 단위</strong>로 등록합니다.
        </div>
        <div style="display:flex;gap:6px;margin-bottom:6px;">
          <input type="text" id="tokenDomainInput" placeholder="도메인 (예: dev.uniflow.co.kr)"
            style="flex:1;padding:5px 8px;border:1px solid var(--border-2);border-radius:8px;font-size:13px;">
          <button class="btn-sheet-save" id="fillCurrentDomainBtn">현재 도메인</button>
        </div>
        <input type="text" id="tokenLabelInput" placeholder="구분 라벨 (선택, 예: 개발서버)"
          style="width:100%;padding:5px 8px;margin-bottom:6px;border:1px solid var(--border-2);border-radius:8px;font-size:13px;box-sizing:border-box;">
        <div style="display:flex;gap:6px;">
          <input type="text" id="tokenKeyInput" placeholder="clientKey 토큰"
            style="flex:1;padding:5px 8px;border:1px solid var(--border-2);border-radius:8px;font-size:13px;">
          <button class="btn-extract" id="tokenAddBtn" style="flex:0 0 auto;">등록</button>
        </div>
        <div id="tokenStatus" style="font-size:13px;color:#6b7280;margin-top:6px;min-height:16px;"></div>
        <ul class="file-list" id="tokenList" style="margin-top:6px;"></ul>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
